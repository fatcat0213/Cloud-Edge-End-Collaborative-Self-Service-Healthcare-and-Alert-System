server:
  port: 8080

spring:
  application:
    name: cloud-gateway
  cloud:
    gateway:
      routes:
        - id: simulator-service
          uri: http://simulator-service:8095
          predicates:
            - Path=/simulator/**
        - id: simulator-service-api
          uri: http://simulator-service:8095
          predicates:
            - Path=/api/v1/simulator/**
        - id: payment-service
          uri: http://payment-service:8081
          predicates:
            - Path=/api/v1/payment,/api/v1/payment/**
        - id: registration-service
          uri: http://registration-service:8082
          predicates:
            - Path=/api/v1/registration,/api/v1/registration/**
        - id: report-service
          uri: http://report-service:8083
          predicates:
            - Path=/api/v1/report/**
        - id: queue-service
          uri: http://queue-service:8084
          predicates:
            - Path=/api/v1/queue/**
        - id: insurance-service
          uri: http://insurance-service:8085
          predicates:
            - Path=/api/v1/insurance/**
        - id: edge-service
          uri: http://edge-service:8090
          predicates:
            - Path=/api/v1/alerts/**,/api/v1/commands/**,/api/v1/stats/**
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
