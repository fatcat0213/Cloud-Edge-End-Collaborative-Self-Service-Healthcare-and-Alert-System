apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
  namespace: yunbianduan-cloud
  labels:
    app: queue-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-service
  template:
    metadata:
      labels:
        app: queue-service
    spec:
      containers:
      - name: queue-service
        image: yunbd/queue-service:latest
        ports:
        - containerPort: 8084
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: queue-service
  namespace: yunbianduan-cloud
  labels:
    app: queue-service
spec:
  type: ClusterIP
  selector:
    app: queue-service
  ports:
  - name: http
    port: 8084
    targetPort: 8084
