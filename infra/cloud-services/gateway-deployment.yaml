apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-gateway
  namespace: yunbianduan-cloud
  labels:
    app: cloud-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-gateway
  template:
    metadata:
      labels:
        app: cloud-gateway
    spec:
      containers:
      - name: cloud-gateway
        image: yunbianduan-cloud-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-gateway
  namespace: yunbianduan-cloud
  labels:
    app: cloud-gateway
spec:
  type: NodePort
  selector:
    app: cloud-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
