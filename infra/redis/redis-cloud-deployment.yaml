apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: yunbianduan-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2
        # Dev note: password is resolved from env-var substitution into the command argument.
        # The resolved value will appear in /proc/1/cmdline on the node. Acceptable for
        # dev; production should use a redis.conf Secret volume instead.
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: yunbianduan-cloud
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
