apiVersion: v1
kind: Service
metadata:
  name: mosquitto-edge
  namespace: yunbianduan-edge
spec:
  type: ClusterIP
  ports:
    - port: 1883
      targetPort: 1883
      protocol: TCP
      name: mqtt
    - port: 1884
      targetPort: 1884
      protocol: TCP
      name: websocket
  selector:
    app: mosquitto-edge
