apiVersion: v1
kind: Service
metadata:
  name: cloudcore
  namespace: kubeedge
  labels:
    app: kubeedge
    component: cloudcore
spec:
  type: NodePort
  ports:
    - name: websocket
      port: 10000
      targetPort: 10000
      nodePort: 30000
      protocol: TCP
  selector:
    app: kubeedge
    component: cloudcore
