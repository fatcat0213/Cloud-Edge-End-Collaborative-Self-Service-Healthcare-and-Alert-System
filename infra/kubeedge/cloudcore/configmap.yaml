apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudcore-configmap
  namespace: kubeedge
  labels:
    app: kubeedge
    component: cloudcore
data:
  cloudcore.yaml: |
    apiVersion: kubeedge.io/v1alpha2
    kind: CloudCore
    metadata:
      name: cloudcore
    spec:
      cloudHub:
        advertiseAddress: "# TODO: Replace with actual K8s node IP (run: kubectl get nodes -o wide)"
        nodeIP: ""
        nodePort: 10000
        port: 10000
        protocol: websocket
        quotaBackendBytes: 52428800
        maxInboundChanellength: 1000
      router:
        component:
          enable: true
      edged:
        enable: true
        maxFailedPerMinute: 30
        nodeFailureExpiryInMinutes: 2
      dogfood:
        enable: false
      edgeMesh:
        enable: false
