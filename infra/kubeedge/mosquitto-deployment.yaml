apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: yunbianduan-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883   # MQTT
        - containerPort: 8883   # MQTT over TLS
        volumeMounts:
        - name: mosquitto-config
          mountPath: /mosquitto/config
        - name: mosquitto-data
          mountPath: /mosquitto/data
      volumes:
      - name: mosquitto-config
        configMap:
          name: mosquitto-config
      - name: mosquitto-data
        hostPath:
          path: /data/yunbianduan/mosquitto
          type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: yunbianduan-edge
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: yunbianduan-edge
spec:
  selector:
    app: mosquitto
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
