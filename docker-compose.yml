version: '3.8'

# 云边端就医自助终端监测及预警系统 — 本地全栈启动
# 构建步骤：
#   mvn package -DskipTests -pl '!flink-jobs'
#   docker compose up --build

services:

  # ─── 基础设施 ───────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: yunbd-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yunbd-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Kafka 仅在 --profile full 时启动（国内网络可能超时拉取镜像）
  kafka:
    image: soldevelo/kafka:3.6
    container_name: yunbd-kafka
    profiles: ["full"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  # ─── 业务微服务（后端，无外部依赖）───────────────────────────
  insurance-service:
    build: ./insurance-service
    container_name: yunbd-insurance
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8085"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  registration-service:
    build: ./registration-service
    container_name: yunbd-registration
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  report-service:
    build: ./report-service
    container_name: yunbd-report
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8083"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  queue-service:
    build: ./queue-service
    container_name: yunbd-queue
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8084"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # ─── 支付服务（依赖 Redis + Insurance）──────────────────────
  payment-service:
    build: ./payment-service
    container_name: yunbd-payment
    ports:
      - "8081:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INSURANCE_SERVICE_URL: http://insurance-service:8085
    depends_on:
      redis:
        condition: service_healthy
      insurance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # ─── 边缘服务（连接 Mosquitto + Redis，运行 Drools 规则）────
  edge-service:
    build: ./edge-service
    container_name: yunbd-edge
    ports:
      - "8090:8090"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      HMAC_SECRET: yunbd-terminal-secret-2026
    depends_on:
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 网关（路由所有 API，Redis 限流）────────────────────────
  cloud-gateway:
    build: ./cloud-gateway
    container_name: yunbd-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      registration-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      queue-service:
        condition: service_healthy
      insurance-service:
        condition: service_healthy
      edge-service:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: yunbd-frontend
    ports:
      - "3000:80"
    depends_on:
      - cloud-gateway
